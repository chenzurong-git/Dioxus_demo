name: Build Windows exe

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CI 直连官方 crates.io 更稳；仓库内 .cargo/config.toml 是给国内网络用的 USTC 镜像，
      # 且其中 linker=gcc 只针对 windows-gnu 目标，MSVC 构建不需要。
      - name: Remove mirror config for CI
        shell: pwsh
        run: Remove-Item .cargo\config.toml -ErrorAction SilentlyContinue

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\dioxus-demo.exe dist\
          if (Test-Path target\release\WebView2Loader.dll) {
            Copy-Item target\release\WebView2Loader.dll dist\
          } else {
            Write-Host "::warning::WebView2Loader.dll 未生成，运行 exe 可能报缺 DLL"
          }

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          # choco 的 nsis 包不一定会生成 PATH shim，优先用安装目录里的完整路径
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidates = @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $exe) { throw "未找到 makensis，请确认 choco install nsis 成功" }
            $makensis = $exe
          }
          & $makensis /DAPP_VERSION=$v packaging\installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: dioxus-demo-windows
          path: dist/

      # 打 v* tag 时自动发布到 GitHub Releases（绿色版 zip 内容 = dist/）
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
